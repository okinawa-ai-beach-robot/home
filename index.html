<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okinawa AI Beach Robot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <style>
        body { 
	    margin: 0;
            font-family: Arial, sans-serif;
	    background: linear-gradient(to bottom, #00bfff 40%, #1e90ff, #f4a261); /* Blue to sand gradient */
            color: white;
            text-align: center;
        }
        .swiper { width: 100vw; height: 50vh; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }
        h1 {
	    margin-top: 0;
            background: rgba(255, 255, 255, 0.7); /* Semi-transparent white for contrast */
            padding: 20px;
            font-size: 2em;
            font-weight: bold;
            color: #1e90ff; /* Deep blue text for better contrast */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); /* Subtle shadow for readability */
        }
        .contact img {
            width: 25%; /* Shrinking the LINE QR code */
        }

	/* Define the separator line for all sections */
        section {
            border-top: 2px solid #f4a261; /* Sand-colored separator line */
	    margin-top: 0;
        }

        .news p, .contact p {
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="swiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="media/robobeach.jpg" alt="Robot in action"></div>
            <div class="swiper-slide"><img src="media/operator.jpg" alt="Initial beach testing"></div>
            <div class="swiper-slide"><img src="media/trash.png" alt="AI detection"></div>
        </div>

        <!-- Navigation buttons (prev/next) -->
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>

        <!-- Pagination (dots) -->
        <div class="swiper-pagination"></div>
    </div>

    <section>
        <h1>Beachbot, a beach cleaning robot</h1>
    </section>

    <section class="news">
        <h2>News</h2>
        <p>Join our Hack-a-thon on March 29, 2025!</p>
        <p>Time: 10:00 - 12:00</p>
        <p>Sign up using <a href="https://forms.gle/JMHXQJ5WmShw9mbD9">this link</a>.</p>
    </section>

    <section class="collaboration">
        <h2>Collaboration</h2>
        <form action="upload.php" method="post" enctype="multipart/form-data">
            <label for="fileUpload">Upload an image:</label>
            <input type="file" name="fileUpload" id="fileUpload" required>
            <button type="submit" name="submit">Upload</button>
        </form>
    </section>


    <section class="contact">
        <h2>Contact</h2>
        <p>Scan the QR code to add us on LINE:</p>
        <img src="media/line.png" alt="LINE QR Code">
        <p>Email us at: <a href="mailto:info@beachbot.online">info@beachbot.online</a></p>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper('.swiper', {
            loop: true,
            autoplay: {
                delay: 3000,
                disableOnInteraction: false
            },
            effect: 'fade',
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev'
            },
            pagination: {
                el: '.swiper-pagination',
                clickable: true
            }
        });
    </script>
</body>
</html>
